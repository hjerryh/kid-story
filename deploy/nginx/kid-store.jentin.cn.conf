server {
    listen 80;
    listen [::]:80;
    server_name kid-store.jentin.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/kid-store.jentin.cn/shared;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://kid-store.jentin.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kid-store.jentin.cn;

    ssl_certificate /etc/letsencrypt/live/kid-store.jentin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kid-store.jentin.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/kid-store.jentin.cn/current;
    index index.html;
    access_log /www/wwwlogs/kid-store.jentin.cn.log;
    error_log /www/wwwlogs/kid-store.jentin.cn.error.log;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /_expo/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /library/stories/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ /\. {
        return 404;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
